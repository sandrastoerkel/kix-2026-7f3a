<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Japan-Planer Dezember 2026</title>
<style>
:root{
  --ink:#1b1a22; --ink2:#4a4757; --ink3:#7d7a8c;
  --paper:#f6f2ea; --card:#fffdf8; --line:#e4ddd0;
  --seal:#b8322f; --seal-soft:#f2dedd;
  --indigo:#28356b; --indigo-soft:#e5e8f4;
  --gold:#a8813a; --green:#3f6b4a;
  --shadow:0 1px 2px rgba(27,26,34,.05), 0 8px 24px rgba(27,26,34,.07);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eceaf2; --ink2:#b6b2c4; --ink3:#8a8699;
    --paper:#14131a; --card:#1e1d26; --line:#31303c;
    --seal:#e0665f; --seal-soft:#3a2422;
    --indigo:#9fb0e8; --indigo-soft:#232a44;
    --gold:#d8b061; --green:#7cb08c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    --ink:#eceaf2; --ink2:#b6b2c4; --ink3:#8a8699;
    --paper:#14131a; --card:#1e1d26; --line:#31303c;
    --seal:#e0665f; --seal-soft:#3a2422;
    --indigo:#9fb0e8; --indigo-soft:#232a44;
    --gold:#d8b061; --green:#7cb08c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}

/* ---------- HEADER ---------- */
header{
  position:relative; overflow:hidden;
  background:linear-gradient(135deg,#1a2350 0%,#2c3a72 45%,#5a3c5e 100%);
  color:#fff; padding:26px 20px 20px;
}
header .kanjibg{
  position:absolute; right:-14px; top:-30px; font-size:150px; line-height:1;
  opacity:.11; font-weight:700; letter-spacing:-6px; pointer-events:none;
}
header .eyebrow{font-size:12px; letter-spacing:.22em; text-transform:uppercase; opacity:.72}
header h1{margin:6px 0 4px; font-size:29px; line-height:1.15; font-weight:700; letter-spacing:-.5px}
header h1 .sub{font-weight:400; opacity:.8}
header .dates{font-size:14.5px; opacity:.86}
header .savestate{margin-top:10px; font-size:12px; opacity:.6}

/* ---------- TABS ---------- */
nav.tabs{
  position:sticky; top:0; z-index:40; display:flex; gap:0;
  background:var(--card); border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
nav.tabs button{
  flex:1; background:none; border:0; padding:13px 6px 11px; cursor:pointer;
  font-size:13.5px; font-weight:600; color:var(--ink3);
  border-bottom:2.5px solid transparent; transition:.15s;
}
nav.tabs button .k{display:block; font-size:16px; margin-bottom:1px; opacity:.55}
nav.tabs button.active{color:var(--seal); border-bottom-color:var(--seal)}
nav.tabs button.active .k{opacity:1}

/* ---------- DAY BAR ---------- */
#daybar{
  display:flex; gap:7px; overflow-x:auto; padding:11px 14px;
  background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:49px; z-index:35; scrollbar-width:none;
}
#daybar::-webkit-scrollbar{display:none}
.daychip{
  flex:0 0 auto; width:54px; padding:7px 0 6px; border-radius:11px; cursor:pointer;
  background:var(--paper); border:1px solid var(--line); text-align:center; transition:.15s;
  position:relative;
}
.daychip .kanji{display:block; font-size:16px; font-weight:600; color:var(--ink2)}
.daychip .dt{display:block; font-size:10.5px; color:var(--ink3); margin-top:1px}
.daychip.active{background:var(--indigo); border-color:var(--indigo)}
.daychip.active .kanji,.daychip.active .dt{color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .daychip.active .kanji,:root:not([data-theme="light"]) .daychip.active .dt{color:#0f0e14} }
[data-theme="dark"] .daychip.active .kanji,[data-theme="dark"] .daychip.active .dt{color:#0f0e14}
.daychip .dot{
  position:absolute; top:5px; right:6px; width:6px; height:6px; border-radius:50%;
  background:var(--seal); opacity:0; transition:.15s;
}
.daychip.has-picks .dot{opacity:1}

/* ---------- LAYOUT ---------- */
main{max-width:760px; margin:0 auto; padding:0 14px 60px}
@media(min-width:800px){ main{padding:0 20px 70px} }

/* ---------- DAY HERO ---------- */
.dayhero{
  position:relative; margin:16px 0 0; border-radius:var(--r); overflow:hidden;
  aspect-ratio:16/8; max-width:100%; background:var(--indigo-soft); box-shadow:var(--shadow);
}
.dayhero img{width:100%; height:100%; object-fit:cover}
.dayhero.noimg{aspect-ratio:16/7; background:linear-gradient(140deg,hsl(var(--h) 42% 30%) 0%,hsl(var(--h2) 38% 20%) 100%)}
.dayhero.noimg img{display:none}
.dayhero.noimg .dh-veil{background:linear-gradient(to top,rgba(8,6,14,.55) 0%,rgba(8,6,14,.10) 55%,rgba(8,6,14,0) 100%)}
.dayhero.noimg .credit{display:none}
.dh-kanji{
  position:absolute; right:14px; top:50%; transform:translateY(-58%);
  font-size:clamp(76px,20vw,130px); line-height:1; font-weight:700; color:#fff;
  opacity:.17; letter-spacing:-4px; pointer-events:none; display:none;
}
.dayhero.noimg .dh-kanji{display:block}
.dh-num{
  position:absolute; left:16px; top:14px; font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:rgba(255,255,255,.6); display:none;
}
.dayhero.noimg .dh-num{display:block}
.dh-veil{position:absolute; inset:0; background:linear-gradient(to top,rgba(12,10,20,.78) 0%,rgba(12,10,20,.30) 38%,rgba(12,10,20,.02) 72%,rgba(12,10,20,0) 100%)}
.dh-txt{position:absolute; left:16px; right:16px; bottom:13px; color:#fff}
.dh-txt .d-eyebrow{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; opacity:.82}
.dh-txt h2{margin:3px 0 0; font-size:24px; line-height:1.2; font-weight:700; letter-spacing:-.3px; text-shadow:0 1px 12px rgba(0,0,0,.4)}
.credit{
  position:absolute; right:8px; top:8px; font-size:9.5px; color:rgba(255,255,255,.72);
  background:rgba(0,0,0,.32); padding:2px 7px; border-radius:20px; backdrop-filter:blur(3px);
}
.d-note{
  margin:13px 0 0; padding:12px 14px; background:var(--indigo-soft); border-radius:var(--r);
  font-size:14.5px; color:var(--ink2); line-height:1.55;
}

/* ---------- FIXPUNKTE ---------- */
.fix{
  display:flex; gap:12px; align-items:flex-start; margin-top:10px;
  padding:12px 14px; background:var(--card); border:1px solid var(--line);
  border-left:3px solid var(--seal); border-radius:10px;
}
.ft{flex:0 0 78px; font-size:12.5px; line-height:1.35; font-weight:700; color:var(--seal); font-variant-numeric:tabular-nums; padding-top:2px}
.fb{display:flex; flex-direction:column; gap:2px; min-width:0}
.fb strong{font-size:15px; font-weight:650}
.fb span{font-size:13px; color:var(--ink3); line-height:1.5}

/* ---------- MEIN PLAN ---------- */
.myplan{
  margin-top:14px; padding:13px 15px; border-radius:var(--r);
  background:var(--seal-soft); border:1px dashed var(--seal);
  font-size:14.5px; color:var(--ink);
}
.myplan .mp-title{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--seal); font-weight:700; margin-bottom:5px}
.myplan em{color:var(--ink3); font-style:normal; font-size:13.5px}

/* ---------- SLOTS ---------- */
.slot{margin-top:26px}
.slot-h{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.slot-h h3{margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px}
.slot-h .hint{font-size:12.5px; color:var(--ink3)}
.opts{display:grid; gap:10px}
@media(min-width:660px){ .opts{grid-template-columns:1fr 1fr} }

.opt{
  position:relative; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:14px 15px 13px; cursor:pointer; transition:.16s;
  overflow:hidden;
}
.opt:hover{border-color:var(--ink3); transform:translateY(-1px); box-shadow:var(--shadow)}
.opt.picked{border-color:var(--seal); background:var(--seal-soft)}
.hanko{
  position:absolute; right:11px; top:11px; width:34px; height:34px; border-radius:6px;
  border:2px solid var(--seal); color:var(--seal); font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center; opacity:0; transform:rotate(-14deg) scale(.6);
  transition:.2s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
}
.opt.picked .hanko{opacity:1; transform:rotate(-9deg) scale(1)}
.o-eyebrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); margin-bottom:5px; padding-right:40px}
.cat-k{
  display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px;
  background:var(--indigo); color:var(--paper); border-radius:4px; font-size:11px; letter-spacing:0;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cat-k{color:#14131a} }
[data-theme="dark"] .cat-k{color:#14131a}
.tag{font-size:9.5px; padding:2px 6px; border-radius:20px; letter-spacing:.06em; font-weight:700}
.tag.tip{background:var(--gold); color:#fff}
.tag.kid{background:var(--green); color:#fff}
.tag.lux{background:var(--seal); color:#fff}
.tag.rain{background:var(--indigo); color:var(--paper)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.rain,:root:not([data-theme="light"]) .tag.tip,:root:not([data-theme="light"]) .tag.kid,:root:not([data-theme="light"]) .tag.lux{color:#14131a} }
[data-theme="dark"] .tag.rain,[data-theme="dark"] .tag.tip,[data-theme="dark"] .tag.kid,[data-theme="dark"] .tag.lux{color:#14131a}
.opt h4{margin:0 0 5px; font-size:16.5px; line-height:1.28; font-weight:700; letter-spacing:-.2px; padding-right:38px}
.opt .what{margin:0 0 6px; font-size:14px; line-height:1.55; color:var(--ink2)}
.opt .why{margin:0 0 6px; font-size:13.5px; line-height:1.55; color:var(--ink2); padding-left:11px; border-left:2px solid var(--line)}
.opt .why b{color:var(--ink); font-weight:650}
.o-meta{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink3)}
.o-meta .maps{color:var(--indigo); text-decoration:none; font-weight:650; white-space:nowrap}
.o-meta .maps:hover{text-decoration:underline}

/* ---------- CHECKLISTE ---------- */
.section-intro{margin:20px 0 4px; padding:14px 16px; background:var(--indigo-soft); border-radius:var(--r); font-size:14.5px; line-height:1.6; color:var(--ink2)}
.chk-group-h{margin:26px 0 10px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--seal); font-weight:700}
.chk{
  display:flex; gap:12px; align-items:flex-start; padding:13px 15px; margin-bottom:9px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r); cursor:pointer; transition:.15s;
}
.chk:hover{border-color:var(--ink3)}
.chk.done{opacity:.5}
.chk.done .c-t{text-decoration:line-through}
.chk .box{
  flex:0 0 21px; height:21px; margin-top:1px; border:2px solid var(--ink3); border-radius:6px;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; transition:.15s;
}
.chk.done .box{background:var(--green); border-color:var(--green)}
.chk .c-body{min-width:0; flex:1}
.c-t{font-size:15px; font-weight:650; line-height:1.35}
.c-s{font-size:13px; color:var(--ink3); line-height:1.5; margin-top:3px}
.c-due{display:inline-block; margin-top:6px; font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:20px; background:var(--indigo-soft); color:var(--indigo)}
.c-due.hard{background:var(--seal); color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .c-due.hard{color:#14131a} }
[data-theme="dark"] .c-due.hard{color:#14131a}

/* ---------- INFO ---------- */
.info-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 17px; margin-bottom:12px}
.info-card h3{margin:0 0 10px; font-size:17px; font-weight:700; letter-spacing:-.2px; display:flex; align-items:center; gap:8px}
.info-card h3 .k{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:var(--seal); color:#fff; border-radius:6px; font-size:13px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .info-card h3 .k{color:#14131a} }
[data-theme="dark"] .info-card h3 .k{color:#14131a}
.info-card p{margin:0 0 9px; font-size:14.5px; line-height:1.6; color:var(--ink2)}
.info-card ul{margin:0 0 9px; padding-left:19px}
.info-card li{font-size:14.5px; line-height:1.6; color:var(--ink2); margin-bottom:5px}
.info-card b{color:var(--ink)}
.info-card:last-child{margin-bottom:0}
.tbl-wrap{overflow-x:auto; margin:0 0 10px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:420px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line)}
th{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); font-weight:700}
td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tr.sum td{font-weight:700; border-bottom:0; border-top:2px solid var(--line)}

.hotel{border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:10px; padding:13px 15px; margin-bottom:10px; background:var(--paper)}
.hotel .h-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.hotel .h-name{font-size:15.5px; font-weight:700}
.hotel .h-nights{font-size:12.5px; color:var(--ink3); white-space:nowrap}
.hotel dl{margin:9px 0 0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13.5px}
.hotel dt{color:var(--ink3); white-space:nowrap}
.hotel dd{margin:0; color:var(--ink2)}
.hotel .hwarn{margin-top:10px; padding:10px 12px; background:var(--seal-soft); border-left:3px solid var(--seal); border-radius:0 8px 8px 0; font-size:13.5px; line-height:1.55; color:var(--ink2)}
.kand-h{margin:14px 0 8px; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink3); font-weight:700}
.kand{padding:10px 0; border-top:1px solid var(--line)}
.kand .k-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; margin-bottom:4px}
.kand .k-top a{font-size:14.5px; font-weight:700; color:var(--indigo); text-decoration:none}
.kand .k-top a:hover{text-decoration:underline}
.kand .k-meta{font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums}
.kand p{margin:0; font-size:13.5px; line-height:1.55; color:var(--ink2)}
.hotel.isbooked{border-left-color:var(--green)}
.hotel .booked{margin-top:10px; padding:10px 12px; background:var(--card); border:1px solid var(--green); border-radius:8px; font-size:13.5px; line-height:1.55; color:var(--ink2)}
.hotel .booked b{color:var(--green)}
.hotel .slotline{margin-top:10px; padding:9px 11px; border:1px dashed var(--ink3); border-radius:8px; font-size:13px; color:var(--ink3)}


/* ---------- KARTE ---------- */
.map-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-top:14px}
.map-card h3{margin:0 0 4px; font-size:17px; font-weight:700}
.map-card .sub{margin:0 0 10px; font-size:13px; color:var(--ink3)}
.map-svg{width:100%; height:auto; display:block; border-radius:10px; background:var(--indigo-soft); border:1px solid var(--line)}
.map-svg .land{fill:var(--card); stroke:var(--ink3); stroke-width:1.4}
.map-svg .route{fill:none; stroke:var(--seal); stroke-width:4; stroke-dasharray:12 9}
.map-svg .pt-booked{fill:var(--green); stroke:var(--card); stroke-width:3}
.map-svg .pt-open{fill:var(--gold); stroke:var(--card); stroke-width:3}
.map-svg .pt-sight{fill:var(--indigo); stroke:var(--card); stroke-width:1.5}
.map-svg text{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); paint-order:stroke; stroke:var(--indigo-soft); stroke-width:7px; stroke-linejoin:round}
.map-svg text.small{font-size:23px; font-weight:500; fill:var(--ink2)}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; font-size:12.5px; color:var(--ink2)}
.legend span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; background:var(--c)}
.places{margin:8px 0 0; padding:0; list-style:none}
.places li{display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding:9px 0; border-top:1px solid var(--line); font-size:14px; color:var(--ink2)}
.places li b{color:var(--ink)}
.places a{color:var(--indigo); font-weight:650; text-decoration:none; white-space:nowrap; font-size:13px}
footer{max-width:760px; margin:0 auto; padding:26px 16px 40px; font-size:12px; line-height:1.65; color:var(--ink3)}
footer b{color:var(--ink2)}
.eur{color:var(--ink3); font-size:.88em; white-space:nowrap}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--seal); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

  {h:"Vom Flughafen in die Stadt", hint:"eine Option wählen", opts:[
   {id:"d1a", c:"transfer", n:"Nankai Airport Express nach Namba", tags:["tip"],
    what:"Der normale Nahverkehrszug der Nankai-Linie, fährt alle 15–20 Min. direkt von der Ankunftshalle bis Namba. Keine Reservierung, keine Sitzplatzgarantie. In Namba umsteigen in die Midosuji-Linie, 2 Stationen bis Hommachi.",
    why:"Mit Abstand das beste Preis-Leistungs-Verhältnis, und um diese Uhrzeit ist der Zug leer genug, dass ihr mit vier Koffern bequem sitzt. <b>Für die Kinder:</b> nach neun Stunden Flug ist ein Zug, in dem man aufstehen und aus dem Fenster gucken kann, angenehmer als ein enges Taxi.",
    meta:"45 Min. · ¥970 Erw. / ¥490 Kind · Familie ¥2.920", maps:M("Kansai Airport Station Nankai")},
   {id:"d1b", c:"transfer", n:"Nankai Rapi:t — der blaue Schnellzug",
    what:"Der Designzug der Nankai-Linie mit runden Bullaugen-Fenstern und reservierten Ledersitzen. Sieht aus wie ein U-Boot auf Schienen.",
    why:"Zehn Minuten schneller und garantierte Sitzplätze nebeneinander. <b>Für die Kinder:</b> der Zug selbst ist die Attraktion — die Bullaugen und die Retro-Futurismus-Nase sind das erste richtige Japan-Foto der Reise.",
    meta:"34–39 Min. · ¥1.670 Erw. / ¥840 Kind · Familie ~¥5.020", maps:M("Nankai Rapi:t Kansai Airport")},
   {id:"d1c", c:"transfer", n:"Taxi direkt zum Hotel",
    what:"Ab dem Terminal per Taxistand oder GO-App. Für vier Personen mit Gepäck braucht es meist ein Großraumtaxi (Jumbo Taxi).",
    why:"Null Umsteigen, Tür zu Tür, Koffer im Kofferraum. <b>Wenn die Kinder im Flieger nicht geschlafen haben,</b> ist das die ruhigste Variante — nur eben die teuerste.",
    meta:"50–65 Min. · ~¥18.000–22.000 gesamt", maps:M("Kansai International Airport Taxi Stand")}
  ]},
  {h:"Falls doch noch Energie da ist", hint:"alles optional", opts:[
   {id:"d1d", c:"licht", n:"Dotonbori bei Nacht", tags:["tip"],
    what:"Die Kanalpromenade mit dem Glico-Läufer-Neonschild, dem beweglichen Krabbenschild und einer Wand aus Leuchtreklame. Vom Namba-Bahnhof fünf Gehminuten.",
    why:"Das ist der Moment, in dem alle vier merken: wir sind wirklich in Japan. Die Schilder leuchten bis Mitternacht, es ist warm angezogen gut auszuhalten und man muss nichts können außer staunen. <b>Für die Kinder:</b> 15 Minuten reichen völlig und sind trotzdem das Erinnerungsfoto.",
    meta:"20–30 Min. · gratis", maps:M("Dotonbori Glico Sign Osaka")},
   {id:"d1e", c:"essen", n:"Konbini-Abendessen im Zimmer",
    what:"Lawson, FamilyMart oder 7-Eleven — an jeder Ecke, 24 Stunden offen. Onigiri, Karaage, Instant-Ramen, Sandwiches, Pudding.",
    why:"Um halb zehn abends mit müden Kindern das Vernünftigste, was man tun kann. <b>Für die Kinder:</b> ein japanischer Konbini ist selbst schon ein Erlebnis — jeder darf sich drei Dinge aussuchen, die er nicht kennt.",
    meta:"20 Min. · ~¥3.000 Familie", maps:M("Lawson Namba Osaka")},
   {id:"d1f", c:"essen", n:"Erste Ramen in Namba",
    what:"Rund um den Bahnhof haben viele Ramen-Läden bis 1 Uhr nachts offen, bestellt wird am Automaten am Eingang.",

{k:"日", dt:"So 13.12.", title:"Osaka ankommen",
 img:W("c/ca/Osaka_Castle_03bs3200.jpg/1920px-Osaka_Castle_03bs3200.jpg"), cr:"Osaka Castle · Wikimedia Commons",
 note:"Erster ganzer Tag, bewusst ohne festen Termin. Nicht zu früh los — der Jetlag ist mit einer Stunde Zeitverschiebung mild, aber der Flugtag steckt allen in den Knochen.",
 fix:[],
 slots:[
  {h:"Vormittag", hint:"eines aussuchen", opts:[
   {id:"d2a", c:"kultur", n:"Osaka Castle", tags:["tip"],
    what:"Die weiße Burg mit den goldenen Ziergiebeln steht auf einem gewaltigen Steinwall mitten im Park. Innen ein modernes Museum über acht Etagen, ganz oben eine Aussichtsplattform mit Blick über die Stadt.",
    why:"Die Anlage ist so groß, dass man auch ohne Innenbesuch einen schönen Vormittag hat: Wassergräben, Kirschbäume, Straßenmusik. <b>Für die Kinder:</b> im Museum gibt es Rüstungen, Helme mit Hörnern und eine Filmstation zur Belagerung von 1615 — Ritterburg auf Japanisch.",
    meta:"2–3 Std. · Park gratis · Turm ¥600 Erw., unter 15 frei", maps:M("Osaka Castle")},
   {id:"d2b", c:"essen", n:"Kuromon-Markt",
    what:"Eine 580 m lange überdachte Markthalle mit rund 150 Ständen: Fisch, Wagyu-Spieße, Tako-Yaki, Erdbeeren im Winter, frisch aufgeschnittene Melone. Viele Stände grillen direkt vor Ort.",
    why:"Osaka nennt sich selbst „die Küche Japans“ — hier sieht man warum. Man isst sich einmal quer durch, im Stehen, für wenig Geld. <b>Für die Kinder:</b> alles ist sichtbar, riecht gut und wird vor ihren Augen gemacht. Wer nichts Rohes mag, findet trotzdem zehn Sachen.",
    meta:"1–1,5 Std. · ~¥3.000–5.000 Familie · 9–18 Uhr", maps:M("Kuromon Ichiba Market Osaka")},
   {id:"d2c", c:"museum", n:"Museum of Housing and Living", tags:["rain","kid"],
    what:"Im 8. Stock eines Hochhauses ist eine komplette Edo-Straße von 1830 nachgebaut — Häuser zum Betreten, wechselndes Tageslicht von Morgen bis Gewitter, Geräuschkulisse.",
    why:"Kein Museum zum Anschauen, sondern eins zum Hineinlaufen. <b>Für die Kinder:</b> man darf für ~¥1.000 einen Kimono leihen und in dem Straßenset herumlaufen — das ist der Fotospot der ganzen Osaka-Woche. Perfekt bei Regen.",
    meta:"1,5–2 Std. · Erw. ¥600, Schüler frei · Di geschlossen", maps:M("Osaka Museum of Housing and Living")},
   {id:"d2d", c:"kids", n:"Pokémon Center Osaka + Nintendo Osaka",
    what:"Beide im Daimaru-Kaufhaus in Shinsaibashi, zwei Etagen übereinander. Riesige Figuren am Eingang, exklusive Ware, die es nur in Japan gibt.",
    why:"Ehrlich: das ist ein Laden. Aber es ist der Laden, von dem die Kinder zuhause erzählen werden. <b>Tipp:</b> vorher ein Taschengeld-Budget festlegen, sonst wird es teuer.",
    meta:"1–1,5 Std. · Eintritt frei", maps:M("Pokemon Center Osaka Daimaru Shinsaibashi")}
  ]},
  {h:"Nachmittag", opts:[
   {id:"d2e", c:"viertel", n:"Shinsekai & Tsutenkaku-Turm",
    what:"Ein Viertel, das 1912 nach dem Vorbild von Paris und Coney Island gebaut wurde und seither stehengeblieben ist. In der Mitte der Tsutenkaku-Turm, drumherum grelle Reklame und Kushikatsu-Buden (frittierte Spieße).",
    why:"Das schrillste, unaufgeräumteste Osaka — ein bewusster Kontrast zur ordentlichen Burg vom Vormittag. <b>Für die Kinder:</b> im Turm gibt es eine Rutsche vom 3. in den 1. Stock, die „Tower Slider“, 60 Meter in zehn Sekunden.",
    meta:"2 Std. · Turm ¥1.200 Erw. / ¥600 Kind · Rutsche ¥1.000 extra", maps:M("Tsutenkaku Shinsekai Osaka")},
   {id:"d2f", c:"natur", n:"Nakanoshima-Insel & Bibliothek",
    what:"Eine schmale Insel zwischen zwei Flussarmen mitten in der Stadt, mit Rosengarten, alter Backsteinbibliothek und Uferpromenade.",
    why:"Der ruhige Gegenentwurf. Wenn nach dem Flugtag jemand nur spazieren will, ist das der richtige Ort — und abends startet hier die Illumination (siehe unten).",
    meta:"1–1,5 Std. · gratis", maps:M("Nakanoshima Park Osaka")},
   {id:"d2g", c:"aussicht", n:"Hep Five Riesenrad, Umeda",
    what:"Ein knallrotes Riesenrad, das aus dem Dach eines Kaufhauses wächst. Eine Runde dauert 15 Minuten, die Gondeln haben Bluetooth-Lautsprecher.",
    why:"Kurz, warm, kein Anstehen, und man sieht Osaka von oben, ohne für ein Observatorium zu zahlen. <b>Für die Kinder:</b> man darf die eigene Musik in der Gondel abspielen.",
    meta:"45 Min. · ¥800 p.P., unter 6 frei", maps:M("HEP FIVE Ferris Wheel Osaka")}
  ]},
  {h:"Abend", hint:"Dezember-Highlight", opts:[
   {id:"d2h", c:"licht", n:"Midosuji-Illumination", tags:["tip"],
    what:"Die Midosuji ist Osakas Prachtstraße. Vier Kilometer Ginkgo-Bäume werden von Umeda bis Namba komplett in Licht gehüllt — offiziell die längste beleuchtete Straße der Welt.",
    why:"Euer Hotel liegt an der Station Hommachi, die unter der Midosuji liegt — ihr müsst nur hinaus und die Straße entlanggehen. Kostet nichts, dauert so lange wie ihr wollt, und es gibt an jedem Abschnitt eine andere Lichtfarbe. <b>Für die Kinder:</b> zwischendurch Konbini-Kakao, dann läuft es sich gut.",
    meta:"1 Std. · gratis · voraussichtlich bis 31.12., 2026er Termin noch offen", maps:M("Midosuji Osaka")},
   {id:"d2i", c:"licht", n:"Osaka Hikari Renaissance, Nakanoshima",
    what:"Osakas großes Winterlichtfest: die Fassade der Zentralen Öffentlichen Halle wird bespielt, dazu eine Lichtallee entlang des Flusses und Buden mit Glühwein und Suppe.",
    why:"Läuft 2025 vom 14. bis 25.12. — 2026 also mit hoher Wahrscheinlichkeit genau in eurer Osaka-Woche, aber der Termin ist noch nicht bestätigt. Wenn er passt, ist das der schönste Abend in Osaka.",
    meta:"1–1,5 Std. · gratis · Termin 2026 noch nicht veröffentlicht", maps:M("Nakanoshima Osaka Hikari Renaissance")},
   {id:"d2j", c:"essen", n:"Okonomiyaki selbst braten",
    what:"Osakas Nationalgericht: ein herzhafter Pfannkuchen aus Kohl, Teig und Zutaten nach Wahl. In vielen Lokalen ist eine heiße Platte in den Tisch eingelassen und man brät selbst.",
    why:"Essen und Beschäftigung in einem. <b>Für die Kinder:</b> jeder gestaltet seinen eigenen, wenden ist der Höhepunkt des Abends. Nichts ist roh, nichts ist scharf.",
    meta:"1,5 Std. · ~¥1.200–2.000 p.P.", maps:M("Okonomiyaki Dotonbori Osaka")}
  ]}
 ]},

   {id:"d3d", c:"aktiv", n:"Hollywood Dream & Flying Dinosaur",

{k:"火", dt:"Di 15.12.", title:"Aquarium & Aussicht",

   {id:"d4a", c:"kids", n:"Kaiyukan — Osaka Aquarium", tags:["tip","kid"],
    what:"Eines der größten Aquarien der Welt, gebaut als eine einzige Spirale: man fährt in den 8. Stock hoch und geht dann langsam an einem 9 m tiefen Zentralbecken nach unten. In diesem Becken schwimmen zwei Walhaie — die größten Fische der Erde.",
    why:"Der Aufbau ist genial, weil man dasselbe Becken auf jeder Etage aus einer anderen Tiefe sieht. Dazu 15 Themenzonen von der Antarktis bis zum Great Barrier Reef. <b>Für die Kinder:</b> im Erdgeschoss gibt es ein Anfassbecken mit Rochen und Kleinhaien, und die Kapuzineraffen und Otter am Anfang holen auch Museumsmuffel ab. Rechnet mit 3 Stunden, nicht mit 1,5.",

  {h:"Nachmittag", opts:[

    what:"112 m hoch, direkt neben dem Aquarium, eine Runde dauert 17 Minuten. Einige Gondeln haben durchsichtige Böden. Nachts leuchtet das Rad als Wetterbericht: rot heißt morgen sonnig, grün bewölkt, blau Regen.",
    why:"Von oben sieht man die Bucht, den Hafen und bei klarem Wetter bis Kobe. <b>Für die Kinder:</b> die Glasboden-Gondel ist ein kleiner Mutbeweis, man kann aber auch eine normale nehmen.",

   {id:"d4d", c:"aktiv", n:"Santa-Maria-Bootstour",
    what:"Ein Nachbau von Kolumbus' Schiff, das eine 45-Minuten-Runde durch die Bucht von Osaka fährt. Ab dem Anleger am Aquarium.",

   {id:"d4e", c:"shopping", n:"Den-Den Town, Nipponbashi",
    what:"Osakas Elektronik- und Anime-Viertel: mehrere Straßenzüge mit Spielkonsolen, Retro-Games, Gashapon-Automaten und Modellbau.",
    why:"Die Gashapon-Hallen — hunderte Kapselautomaten nebeneinander — sind für Kinder in dem Alter ein eigenes Universum. <b>Tipp:</b> ¥1.000 Münzgeld pro Kind mitgeben und laufen lassen.",
    meta:"1,5 Std. · Eintritt frei · zu Fuß von Namba", maps:M("Den Den Town Nipponbashi Osaka")}
  ]},
  {h:"Abend", opts:[
   {id:"d4f", c:"aussicht", n:"Umeda Sky Building", tags:["tip"],
    what:"Zwei Hochhaustürme, oben durch eine schwebende Ringplattform verbunden — dem „Floating Garden Observatory“ in 173 m Höhe. Die letzte Etappe fährt man mit einer verglasten Rolltreppe frei durch die Luft zwischen den Türmen.",
    why:"Der Weg nach oben ist besser als die Aussicht, und die Aussicht ist schon sehr gut. Die oberste Ebene ist offen — es zieht, aber man steht wirklich draußen über der Stadt. <b>Für die Kinder:</b> die Rolltreppe ist der Nervenkitzel des Tages. Sonnenuntergang gegen 16:50, also gegen 16:15 oben sein.",

    what:"Direkt unter dem Gebäude findet jedes Jahr ein deutscher Weihnachtsmarkt statt, mit Holzbuden, Pyramide, Glühwein und Bratwurst.",

    meta:"1 Std. · Eintritt frei, Verzehr extra · Termin 2026 offen", maps:M("German Christmas Market Umeda Sky Building Osaka")}

 ]},

    why:"Oben sieht man ganz Nara und das Umland, und meistens grasen Rehe mit auf der Wiese. Kostet fast nichts und bringt Bewegung in den Tag. <b>Für die Kinder:</b> runter kann man rennen.",

{k:"日", dt:"So 20.12.", title:"Tokio kennenlernen",

 slots:[
  {h:"Vormittag", opts:[
   {id:"d9a", c:"tempel", n:"Meiji Jingu", tags:["tip"],
    what:"Ein Shinto-Schrein mitten in einem 70 Hektar großen Wald, der vor gut hundert Jahren komplett von Hand gepflanzt wurde — 100.000 Bäume aus ganz Japan. Vom Bahnhof Harajuku führt ein breiter Kiesweg unter riesigen Holz-Torii hindurch.",
    why:"Man geht drei Minuten und hört die Stadt nicht mehr. Sonntags finden hier oft traditionelle Hochzeitszüge statt, das ist Zufall und kostet nichts. <b>Für die Kinder:</b> am Schrein kann jeder ein Ema-Holztäfelchen kaufen, einen Wunsch daraufschreiben und aufhängen — ein schönes Familienritual zum Reisestart. Dazu die Wand aus gestifteten Sake-Fässern gleich am Eingang.",
    meta:"1,5–2 Std. · gratis · ab Sonnenaufgang offen", maps:M("Meiji Jingu Shrine Tokyo")},

    what:"Direkt neben dem Schrein: große Wiesen, Radwege, an Sonntagen Straßenmusiker, Jongleure und Tanzgruppen.",

  ]},
  {h:"Nachmittag", opts:[
   {id:"d9c", c:"kids", n:"Takeshita Street, Harajuku", tags:["tip","kid"],

    why:"Der grellste Ort der Reise, und für Kinder in dem Alter genau richtig. <b>Für die Kinder:</b> Purikura sind Fotoautomaten, die Augen vergrößern und Sticker aufkleben — man geht zu viert rein und kommt mit einem albernen Bogen Fotos raus. Das ist das Souvenir, das übrig bleibt. Dazu die Regenbogen-Käsetoasts und meterhohen Zuckerwatten.",
    meta:"1,5–2 Std. · gratis, Snacks extra · Purikura ~¥500", maps:M("Takeshita Street Harajuku")},
   {id:"d9d", c:"shopping", n:"Kiddy Land Omotesando",
    what:"Fünf Etagen Spielzeug, jede Etage einer Marke gewidmet: Sanrio, Studio Ghibli, Snoopy, Pokémon, Rilakkuma.",
    why:"Es ist der beste Spielzeugladen der Stadt, und die Ghibli-Etage ist auch dann schön, wenn ihr das Museum später sowieso besucht. <b>Tipp:</b> Budget vorher festlegen.",

   {id:"d9e", c:"kids", n:"Nintendo TOKYO & Pokémon Center Shibuya",
    what:"Beide im 6. Stock des Shibuya Parco, nebeneinander. Nintendo TOKYO ist der einzige offizielle Nintendo-Store Japans.",
    why:"Wenn die Kinder USJ und Super Nintendo World geliebt haben, ist das der Nachschlag. <b>Ehrlich:</b> es kann voll sein und es gibt manchmal Einlasskarten — kurz vor Ladenschluss ist es am ruhigsten.",

    what:"Die berühmteste Kreuzung der Welt: bei jeder Grünphase gehen mehrere tausend Menschen gleichzeitig in alle Richtungen. Daneben die Bronzestatue des Hundes Hachiko, der neun Jahre lang auf sein verstorbenes Herrchen wartete.",

    what:"Direkt neben dem Museum: ein großer Park um einen See, mit Ruder- und Schwanentretbooten, einem kleinen Schrein auf einer Insel und einem Zoo mit Streichelgehege.",
    why:"Der Weg vom Bahnhof zum Museum führt ohnehin am Park entlang. <b>Für die Kinder:</b> Tretboot fahren nach dem Museum ist der perfekte Abschluss — und im Dezember ist wenig los. Warm anziehen, auf dem Wasser zieht es.",

   {id:"d10c", c:"viertel", n:"Kichijoji & Sun Road",

    why:"Es ist Tokio ohne Touristen. <b>Für die Kinder:</b> in der Sun Road gibt es die berühmten Menchi-Katsu-Fleischkrapfen, für die man kurz ansteht — das gehört dazu.",

    why:"Sonnenuntergang gegen 16:30. Wer das Ghibli-Museum am Vormittag hat, kommt zeitlich perfekt hin.",
    meta:"1,5 Std. · Familie ~¥9.200 · Slot vorab", maps:M("Shibuya Sky Tokyo")},
   {id:"d10e", c:"licht", n:"Blue Cave Shibuya", tags:["kid"],
    what:"Eine Allee zwischen Shibuya und Yoyogi-Park, deren Bäume komplett in blaues Licht getaucht werden — der Weg wirkt wie ein Tunnel unter Wasser.",
    why:"Nah an Shibuya Sky, kostenlos und in 20 Minuten erledigt. <b>Für die Kinder:</b> visuell der stärkste Weihnachtseffekt in Tokio. Termin 2026 noch nicht veröffentlicht, läuft aber seit Jahren im Dezember.",

{k:"火", dt:"Di 22.12.", title:"Alt-Tokio: Asakusa & Skytree",

 note:"Der Osten der Stadt, zu Fuß und mit kurzen Wegen. Dienstag gewählt, weil Ghibli und Miraikan heute zu haben — hier ist alles offen.",

 slots:[
  {h:"Vormittag", opts:[
   {id:"d11a", c:"tempel", n:"Senso-ji & Nakamise-Straße", tags:["tip"],
    what:"Tokios ältester Tempel, gegründet 645. Man betritt ihn durch das Kaminarimon-Tor mit der riesigen roten Papierlaterne, dann führt die 250 m lange Nakamise-Straße mit rund 90 kleinen Ständen zum Haupttempel.",
    why:"Der komplette Kontrast zu Shibuya. <b>Für die Kinder:</b> drei Rituale zum Mitmachen — Räucherwerk am Kessel über den Kopf wedeln (soll gesund machen), Hände am Brunnen waschen, und ein Omikuji-Orakel ziehen: man schüttelt einen Zinnbehälter, zieht ein Stäbchen und bekommt sein Los. Bei einem schlechten Los bindet man den Zettel an ein Gestell und lässt das Unglück dort — das nehmen Kinder sehr ernst. Auf der Nakamise: frische Ningyo-yaki und Melonpan.",
    meta:"2–3 Std. · gratis · Stände ab ca. 9:30", maps:M("Sensoji Temple Asakusa")},
   {id:"d11b", c:"kultur", n:"Kimono- oder Yukata-Verleih",
    what:"Rund um Senso-ji gibt es Dutzende Verleihe. Man wird eingekleidet, bekommt die Haare gemacht und gibt alles am Abend zurück.",
    why:"Hier geht es um die Fotos vor der Pagode. <b>Für die Kinder:</b> Kind 2 wird das lieben, Kind 1 vielleicht nicht. Vorher fragen, nicht überrumpeln. Vorab reservieren.",
    meta:"2–3 Std. · ab ~¥3.000 p.P.", maps:M("kimono rental Asakusa")},
   {id:"d11c", c:"viertel", n:"Kappabashi-Küchenstraße",
    what:"Eine 800 m lange Straße, in der sich Läden für Gastronomiebedarf aneinanderreihen: Messer, Geschirr, Kochwerkzeug — und vor allem die täuschend echten Plastik-Speisemodelle, die in japanischen Schaufenstern stehen.",
    why:"Skurril und sehr fotogen. <b>Für die Kinder:</b> in manchen Läden kann man in einem kurzen Workshop selbst ein Plastik-Tempura oder ein Wachs-Eis herstellen und mitnehmen — das ist ein echtes Souvenir. Vorab anmelden.",

  {h:"Nachmittag", opts:[
   {id:"d11d", c:"aussicht", n:"Tokyo Skytree", tags:["tip"],
    what:"Mit 634 m der höchste Turm der Welt. Zwei Plattformen: das Tembo Deck auf 350 m mit einem Glasboden-Abschnitt, und das Tembo Galleria auf 450 m, eine spiralförmig ansteigende Glasröhre.",
    why:"Bei klarer Winterluft ist der Fuji von hier gut zu sehen, oft besser als von Shibuya Sky. Online-Ticket spart Schlange und Geld. <b>Für die Kinder:</b> der Glasboden auf 350 m ist der Moment, auf den es ankommt. Wer nicht will, muss nicht drübergehen — er ist nur ein kleines Feld.",
    meta:"2 Std. · Tembo Deck online Erw. ¥2.100 / Kind ¥850 · Familie ¥5.900", maps:M("Tokyo Skytree")},
   {id:"d11e", c:"kids", n:"Kirby Café im Solamachi", tags:["kid"],
    what:"Ein Themen-Café am Fuß des Skytree, komplett in Kirby-Rosa, mit Gerichten in Figurenform. Reservierung ist praktisch Pflicht.",
    why:"Liegt direkt im Skytree-Komplex, also kein Umweg. <b>Ehrlich:</b> das Essen ist Nebensache, es geht um die Optik. Plätze online reservieren, sobald das Zeitfenster aufgeht.",
    meta:"1 Std. · à la carte · Reservierung nötig", maps:M("Kirby Cafe Tokyo Solamachi")},
   {id:"d11f", c:"kids", n:"Hanayashiki",
    what:"Japans ältester Vergnügungspark, eröffnet 1853, mitten in Asakusa auf sehr kleiner Fläche. Die Achterbahn von 1953 fährt zwischen Häuserdächern hindurch.",
    why:"Winzig, altmodisch und charmant — das Gegenteil von USJ. <b>Für die Kinder:</b> mit 9 und 11 ist es eher nostalgisch als aufregend, aber die Achterbahn durch die Nachbarschaft ist eine Erfahrung für sich.",
    meta:"1,5 Std. · Eintritt ¥1.200 Erw. / ¥600 Kind + Fahrchips", maps:M("Asakusa Hanayashiki")},
   {id:"d11g", c:"aktiv", n:"Wasserbus über den Sumida",
    what:"Die Tokyo-Cruise-Boote fahren ab Asakusa flussabwärts Richtung Hamarikyu und Odaiba. Einige Schiffe sind futuristische Entwürfe des Manga-Zeichners Leiji Matsumoto.",
    why:"Die Skyline vom Wasser, unter zwölf verschieden gefärbten Brücken hindurch. <b>Für die Kinder:</b> das Raumschiff-Boot „Himiko“ ist das Ziel — welches fährt, steht im Fahrplan.",
    meta:"40–60 Min. · ~¥1.200–2.000 p.P. je Strecke", maps:M("Tokyo Cruise Asakusa Pier")}
  ]},
  {h:"Abend", opts:[
   {id:"d11h", c:"essen", n:"Monjayaki in Tsukishima",
    what:"Tokios eigene Antwort auf Okonomiyaki: ein flüssigerer Teig, den man auf der Tischplatte mit kleinen Metallspateln festbrät und direkt von der Platte isst. In Tsukishima gibt es eine ganze Straße davon.",
    why:"Sehr lokal, sehr wenig touristisch. <b>Für die Kinder:</b> es ist Essen zum Selbermachen, mit Werkzeug, das man sonst nicht kennt. Das Personal zeigt die ersten Schritte.",
    meta:"1,5 Std. · ~¥1.500–2.500 p.P.", maps:M("Tsukishima Monja Street Tokyo")},
   {id:"d11i", c:"licht", n:"Skytree bei Nacht",
    what:"Der Turm wechselt seine Beleuchtung täglich zwischen zwei Grundmustern in Blau und Violett, im Dezember kommen Sonderfarben dazu.",
    why:"Falls ihr nachmittags nicht hochgefahren seid: von der Brücke am Sumida sieht man den Turm gespiegelt im Wasser. Kostet nichts.",
    meta:"20 Min. · gratis", maps:M("Sumida Park Tokyo Skytree view")}
  ]}

   {id:"d12a", c:"kids", n:"Fantasy Springs", tags:["tip","kid"],

    why:"Wenn ihr nur einen Bereich schafft, dann diesen. <b>Für die Kinder:</b> „Anna and Elsa's Frozen Journey“ ist eine ruhige Bootsfahrt mit erstaunlich guten Animatronics, „Peter Pan's Never Land Adventure“ arbeitet mit einer Art VR-Effekt ohne Brille. Der Zugang wird über die App gesteuert — direkt bei Parköffnung reingehen.",
    meta:"3–4 Std. · im Ticket · Zugang über App", maps:M("Fantasy Springs Tokyo DisneySea")},
   {id:"d12b", c:"aktiv", n:"Journey to the Center of the Earth & Mount Prometheus",

   {id:"d12c", c:"kultur", n:"Mediterranean Harbor & Venezianische Gondeln",

    why:"Selbst wer keine Achterbahn fährt, hat hier einen schönen Tag — die Kulisse ist wirklich außergewöhnlich. <b>Für die Kinder:</b> die Gondelfahrt ist ruhig, kurz und die Gondoliere machen Witze auf Englisch.",

   {id:"d12d", c:"licht", n:"Weihnachtsprogramm & Abendshow", tags:["tip"],

{k:"木", dt:"Do 24.12.", title:"Odaiba & Heiligabend",
 img:W("4/4a/Odaiba_close_up_-_2025_Jan_14_01-27PM.jpeg/1920px-Odaiba_close_up_-_2025_Jan_14_01-27PM.jpeg"), cr:"Odaiba · Wikimedia Commons",
 note:"Alles heute liegt auf einer Linie: Toyosu und Odaiba, verbunden durch die fahrerlose Yurikamome-Hochbahn. Miraikan ist dienstags zu — deshalb liegt es hier. Abends dann Heiligabend, so wie ihr ihn haben wollt: Gottesdienst, Essen, Illuminationen oder Christmas Cake im Hotelzimmer.",
 fix:[
  {t:"Zeitfenster", b:"teamLab Planets Toyosu", s:"Slot vorab buchen · hochkrempelbare Hosen anziehen, man geht barfuß durch Wasser"}
 ],
 slots:[
  {h:"Vormittag", opts:[
   {id:"d13a", c:"museum", n:"Miraikan — Museum der Zukunft", tags:["tip","kid"],
    what:"Japans nationales Wissenschaftsmuseum. Im Zentrum hängt der „Geo-Cosmos“, eine sechs Meter große Kugel aus über zehntausend OLED-Panels, die die Erde in Echtzeit zeigt. Dazu Robotik — darunter der humanoide Roboter ASIMO —, Raumfahrt und ein begehbares Modell einer Raumstation.",
    why:"Eines der besten Wissenschaftsmuseen weltweit und fast alles ist zum Anfassen. <b>Für die Kinder:</b> mit 9 und 11 sind sie genau in der Zielgruppe. Fast alle Stationen sind zweisprachig, und es gibt englischsprachige Erklär-Guides. Rechnet mit drei Stunden.",
    meta:"3 Std. · Erw. ~¥630 / bis 18 J. ~¥210 · Familie ~¥1.700 · Di geschlossen", maps:M("Miraikan Odaiba Tokyo")},
   {id:"d13b", c:"kids", n:"Unicorn Gundam Statue",
    what:"Vor dem Einkaufszentrum DiverCity steht eine 20 m hohe Gundam-Statue. Mehrmals täglich fährt sie zu einer Musik- und Lichtinszenierung ihre Panzerung aus und wechselt in den „Destroy Mode“.",
    why:"Kostet nichts, dauert fünf Minuten, und die Verwandlung ist absurd beeindruckend. <b>Für die Kinder:</b> Zeiten vorher checken, sonst steht man vor einem stillen Riesen. Im Gebäude ist eine Gundam-Ausstellung mit Modellbau-Werkstatt.",
    meta:"45 Min. · gratis", maps:M("Unicorn Gundam Statue Odaiba")}
  ]},
  {h:"Nachmittag", opts:[
   {id:"d13c", c:"kids", n:"teamLab Planets Toyosu", tags:["tip","kid"],
    what:"Kein Museum, sondern eine Folge begehbarer digitaler Räume. Man zieht Schuhe und Socken aus und geht barfuß: durch knietiefes warmes Wasser, in dem projizierte Koi schwimmen und zu Blüten zerplatzen, wenn man sie berührt; über einen weichen Boden, in dem man einsinkt; in einen Raum voller schwebender Orchideen; in einen Spiegelraum ohne erkennbare Grenzen.",
    why:"Der Wow-Moment der Reise, und der einzige Ort, an dem Erwachsene und Kinder exakt dasselbe erleben. <b>Für die Kinder:</b> es gibt nichts zu verstehen, nur zu machen — anfassen ist ausdrücklich erwünscht. <b>Praktisch:</b> Hosen bis übers Knie hochkrempelbar anziehen (Leihshorts gibt es), Röcke sind wegen der Spiegelböden ungeeignet, Schließfächer sind vorhanden. Zeitfenster ist Pflicht.",
    meta:"2 Std. · Erw. ab ¥3.800 / Kind ¥1.500 · Familie ~¥10.600 · Slot vorab", maps:M("teamLab Planets Toyosu")},
   {id:"d13d", c:"kids", n:"Small Worlds Ariake", tags:["rain"],
    what:"Eines der größten Miniaturmuseen der Welt: Sailor-Moon-Tokio, Evangelion-Hangars und ein Raumbahnhof im Maßstab 1:80, alles beweglich und mit Tag-Nacht-Wechsel.",
    why:"Liegt zwischen teamLab und Odaiba. <b>Für die Kinder:</b> man kann sich für ~¥6.000 als Miniaturfigur scannen lassen und wird dauerhaft in einer der Welten aufgestellt — kitschig und ein sehr gutes Souvenir.",
    meta:"2 Std. · Erw. ~¥2.700 / Kind ~¥1.900", maps:M("Small Worlds Tokyo Ariake")},
   {id:"d13e", c:"aussicht", n:"Odaiba Seaside Park & Regenbogenbrücke",
    what:"Ein Sandstrand mit Blick auf die Skyline, die Rainbow Bridge und eine verkleinerte Freiheitsstatue. Die Brücke wird abends beleuchtet.",
    why:"Kostenlos, und die Aussicht auf Tokio über das Wasser ist einer der besten Blicke der Stadt. <b>Für die Kinder:</b> Steine ins Wasser werfen funktioniert überall auf der Welt.",
    meta:"1 Std. · gratis", maps:M("Odaiba Seaside Park Tokyo")}
  ]},
  {h:"Heiligabend", hint:"euer Abend — hier darf auch mehreres zusammen", opts:[
   {id:"d13f", c:"essen", n:"Weihnachtsessen im Restaurant reservieren", tags:["lux","tip"],
    what:"Heiligabend ist in Japan kein Familien-, sondern ein Pärchenabend — Restaurants sind voll und bieten Sondermenüs. Reservierung ist deshalb nötig, nicht optional.",
    why:"Wenn ihr einen richtigen Weihnachtsabend wollt, ist das die Ausgabe, die sich lohnt. <b>Vorschlag:</b> ein Teppanyaki-Restaurant, bei dem der Koch am Tisch kocht — das ist Essen und Show zugleich und funktioniert mit Kindern deutlich besser als ein stilles Menü.",
    meta:"2 Std. · ~¥6.000–15.000 p.P. · unbedingt reservieren", maps:M("teppanyaki restaurant Shinjuku Tokyo")},
   {id:"d13g", c:"essen", n:"Christmas Cake & KFC — der japanische Heiligabend", tags:["kid"],
    what:"In Japan isst man am 24.12. Erdbeer-Sahne-Torte und, dank einer Werbekampagne von 1974, Hähnchen von KFC. Beides muss man vorbestellen, sonst bekommt man nichts.",
    why:"Es ist albern und es ist echt — genau das, was eine Familie Jahre später noch erzählt. <b>Für die Kinder:</b> die Torte im Hotelzimmer, Geschenke daneben, und draußen leuchtet Tokio. Christmas Cake gibt es in jeder Konditorei und in jedem Konbini, ab ca. 20.12. vorbestellen.",
    meta:"Abend im Hotel · Torte ~¥4.000–6.000", maps:M("Christmas cake Tokyo department store")},
   {id:"d13i", c:"kultur", n:"Christvesper auf Deutsch — Kreuzkirche Tokyo", tags:["tip"],
    what:"Die Evangelische Gemeinde Deutscher Sprache Tokyo–Yokohama hat eine eigene Kirche in Shinagawa: Kita-Shinagawa 6-5-26, 141-0001 Tokyo. Gottesdienste sind auf Deutsch, sonntags um 10:30 Uhr.",
    why:"Wenn Heiligabend für euch zur Christvesper gehört, ist das die einzige deutschsprachige Möglichkeit in Tokio — und für die Kinder nach zwölf Tagen Japanisch und Englisch ein vertrauter Anker. <b>Wichtig:</b> Die Zeiten für Heiligabend 2026 sind noch nicht veröffentlicht. Im Advent auf kreuzkirche-tokyo.jp nachsehen oder vorher schreiben an pfarramt@kreuzkirche-tokyo.jp, Tel. +81 3 3441 0673.",
    meta:"1–1,5 Std. · Termin 2026 noch offen · Shinagawa", maps:M("Kreuzkirche Tokyo Kita-Shinagawa 6-5-26 Shinagawa")},
   {id:"d13j", c:"kultur", n:"Candlelight Service auf Englisch — St. Paul International Lutheran",
    what:"Lutherische Gemeinde im Tokyo Lutheran Center, 1-2-32 Fujimi, Chiyoda-ku, 102-0071 — angeschlossen an die Japanische Lutherische Kirche (NRK). 2025 gab es am 24.12. um 19:00 Uhr einen „Christmas Eve Candlelight Service“ mit Musik, Gebeten und Weihnachtslesungen, zweisprachig Japanisch und Englisch.",
    why:"Deutlich zentraler als die Kreuzkirche und sehr gut zu erreichen: JR Iidabashi 2–3 Min., die U-Bahnhöfe Iidabashi und Kudanshita je 3 Min. Ein Kerzenschein-Gottesdienst mit Musik trägt auch, wenn man der Sprache nur halb folgt. <b>Wichtig:</b> 19:00 Uhr ist der Termin von 2025 — für 2026 vorher auf spilchurchtokyo.org prüfen.",
    meta:"1 Std. · 2025 um 19:00 Uhr · Iidabashi", maps:M("St. Paul International Lutheran Church Tokyo Lutheran Center Fujimi Chiyoda")},
   {id:"d13h", c:"licht", n:"Illuminationen an einem Abend abklappern",
    what:"Die drei stärksten in Tokio: Marunouchi (champagnerfarbene Allee am Hauptbahnhof), Roppongi Hills Keyakizaka (blaue Allee mit Tokyo Tower im Hintergrund) und Shibuyas Blue Cave.",
    why:"Kostenlos, draußen, und am 24. sind sie am aufwendigsten bespielt. <b>Für die Kinder:</b> Roppongi Keyakizaka ist der beste Fotospot der Stadt — die Straße fällt ab und der rot leuchtende Tokyo Tower steht genau am Ende.",
    meta:"2 Std. · gratis", maps:M("Roppongi Hills Keyakizaka Illumination")}
  ]}
 ]},

      const r = await window.storage.get(KEY).catch(()=>null);
      if(r && r.value) loadInto(r.value);
      store.mode = "cloud";
    }
  }catch(e){}
  if(store.mode!=="cloud" && localOK()){
    store.mode = "local";
    const raw = (()=>{ try{ return localStorage.getItem(KEY); }catch(e){ return null; } })();
    if(raw) loadInto(raw);
  }
  const msg = {
    cloud:"Auswahl wird gespeichert",
    local:"Auswahl wird auf diesem Gerät gespeichert",
    memory:"Auswahl gilt nur für diese Sitzung"
  };
  document.getElementById("savestate").textContent = msg[store.mode];
}
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    const data = JSON.stringify(state);
    if(store.mode==="cloud"){ try{ await window.storage.set(KEY, data); }catch(e){} }
    else if(store.mode==="local"){ try{ localStorage.setItem(KEY, data); }catch(e){} }
  }, 350);
}

const YEN_PER_EUR = 179;
function fmtEur(n){
  if(n < 1) return "<1";
  if(n < 10) return n.toFixed(2).replace(".", ",");
  return Math.round(n).toLocaleString("de-DE");
}
function yenToEur(str){
  const num = t => parseInt(String(t).replace(/\./g, ""), 10);
  return str.replace(
    /¥\s?(\d{1,3}(?:\.\d{3})+|\d+)(?:\s?[–—-]\s?(?:¥\s?)?(\d{1,3}(?:\.\d{3})+|\d+))?/g,
    (m, a, b) => {
      const v1 = num(a);
      if(!v1) return m;
      if(b === undefined) return m + ' <span class="eur">(≈ €' + fmtEur(v1 / YEN_PER_EUR) + ')</span>';
      const v2 = num(b);
      if(!v2) return m;
      return m + ' <span class="eur">(≈ €' + fmtEur(v1 / YEN_PER_EUR) + '–' + fmtEur(v2 / YEN_PER_EUR) + ')</span>';
    }
  );
}

function renderMap(){
  const pt=(map,k,cls,label,dx,dy,anchor,small)=>{const p=MAP[map].p[k];
    return '<circle class="'+cls+'" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(cls==="pt-sight"?8:12)+'"/>'
      + '<text'+(small?' class="small"':'')+' x="'+(p[0]+dx)+'" y="'+(p[1]+dy)+'" text-anchor="'+(anchor||"start")+'">'+label+'</text>';};
  const line=(map,keys)=>'<polyline class="route" points="'+keys.map(k=>MAP[map].p[k].join(",")).join(" ")+'"/>';
  const A=MAP.A, Bm=MAP.B;
  const svgA='<svg class="map-svg" viewBox="0 0 '+A.W+' '+A.H+'" role="img" aria-label="Karte der Route von Osaka über Kyoto nach Tokio"><path class="land" d="'+A.d+'"/>'
    + line("A",["kix","hommachi","kyoto","tokyo"])
    + pt("A","nara","pt-sight","Nara",16,40,"start",true)
    + pt("A","hommachi","pt-booked","Osaka",-24,36,"end")
    + pt("A","kyoto","pt-open","Kyoto",-12,-24,"end")
    + pt("A","tokyo","pt-booked","Tokio",0,-28,"middle")
    + '</svg>';
  const svgB='<svg class="map-svg" viewBox="0 0 '+Bm.W+' '+Bm.H+'" role="img" aria-label="Detailkarte Osaka, Kyoto, Nara"><path class="land" d="'+Bm.d+'"/>'

    + pt("B","usj","pt-sight","USJ · Kaiyukan",-24,20,"end",true)
    + pt("B","nara","pt-sight","Nara-Park",0,-28,"middle",true)

    + pt("B","kiyo","pt-sight","Kiyomizu-dera",0,-24,"middle",true)
    + pt("B","inari","pt-sight","Fushimi Inari",24,32,"start",true)
    + pt("B","kyoto","pt-open","Kyoto Station · Hotel offen",-28,44,"end")
    + pt("B","hommachi","pt-booked","APA Hommachi ✓",28,-20,"start")
    + '</svg>';
  const G=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);

}
/* ================= INTERAKTION ================= */
function render(){
  renderDaybar();
  if(curView==="days") renderDay();
  else if(curView==="checks") renderChecks();
  else if(curView==="map") renderMap();
  else renderInfo();
  main.innerHTML = yenToEur(main.innerHTML);
  window.scrollTo({top:0, behavior:"instant"});
}

function switchView(v){
  curView = v;
  document.getElementById("tab-days").classList.toggle("active", v==="days");
  document.getElementById("tab-checks").classList.toggle("active", v==="checks");
  document.getElementById("tab-info").classList.toggle("active", v==="info");
  document.getElementById("tab-map").classList.toggle("active", v==="map");
  daybar.classList.toggle("hidden", v!=="days");
  render();
}

document.getElementById("tab-days").onclick   = ()=>switchView("days");
document.getElementById("tab-checks").onclick = ()=>switchView("checks");
document.getElementById("tab-info").onclick   = ()=>switchView("info");
document.getElementById("tab-map").onclick    = ()=>switchView("map");

main.addEventListener("click", e=>{
  const o = e.target.closest("[data-opt]");
  if(o){
    if(e.target.closest("a")) return;
    const id = o.dataset.opt;
    state.sel[id] = !state.sel[id];
    save(); render();
    return;
  }
  const c = e.target.closest("[data-chk]");
  if(c){
    const id = c.dataset.chk;
    state.chk[id] = !state.chk[id];
    save(); render();
  }
});
main.addEventListener("keydown", e=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const t = e.target.closest("[data-opt],[data-chk]");
  if(!t) return;
  e.preventDefault();
  t.click();
});

/* ================= START ================= */
(async ()=>{
  await initStorage();
  renderFoot();
  render();
})();
